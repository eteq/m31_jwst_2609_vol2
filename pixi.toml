[workspace]
authors = ["Erik Tollerud <erik.tollerud@gmail.com>"]
channels = ["conda-forge"]
name = "m31_jwst_2609_vol2"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.14.*"
astropy = ">=7.2.0,<8"
numpy = ">=2.4.3,<3"
scipy = ">=1.16,<2"
matplotlib = ">=3.10.8,<4"
jupyter = ">=1.1.1,<2"
tqdm = ">=4.67.3,<5"
flax = ">=0.12.2,<0.13"
equinox = ">=0.13.6,<0.14"
optax = ">=0.2.8,<0.3"
sympy = ">=1.14.0,<2"
pip = ">=26.0.1,<27"
jax = ">=0.9.2, <1"
numexpr = ">=2.14.1,<3"
pytest = ">=9.0.3,<10"
jupyterlab = ">=4.5.8,<5"

[feature.gpu.dependencies]

[feature.cpu.dependencies]

[feature.gpu.system-requirements]
cuda = "13"

[environments]
gpu = ["gpu"]
default = ["cpu"]

[pypi-dependencies]
jwst = ">=1.20.2, <2"
stpsf = ">=2.1.0, <3"
astroquery = { git = "https://github.com/astropy/astroquery.git" }

[feature.cpu.pypi-dependencies]
numba = ">=0.65.1,<0.66"

[feature.gpu.pypi-dependencies]
jax = { version = ">=0.9.2", extras = ["cuda13"] }
numba-cuda = { version = ">=0.30.2,<0.31", extras=["cu13"] }
numba = ">=0.65.1,<0.66"
#cupy = ">=14.1.0,<15"
cupy-cuda13x = ">=0.14"
